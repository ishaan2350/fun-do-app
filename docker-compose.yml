version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fundoo-db
    restart: always
    environment:
      MYSQL_DATABASE: fundoo_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fundoo-app
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=fundoo_db
      - DB_USER=root
      - DB_PASSWORD=password
      - MAIL_HOST=localhost
      - MAIL_PORT=587
      - MAIL_USER=test@example.com
      - MAIL_PASSWORD=password
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
